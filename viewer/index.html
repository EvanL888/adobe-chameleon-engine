<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chameleon Viewer</title>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --ink:#1f1722; --mute:#6b6270; --line:#e1dce3; --accent:#e86a3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16101a; --card:#211828; --ink:#f3eef5; --mute:#a99fb0; --line:#3a2d42; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
  header { padding:20px 24px 4px; }
  h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; color:var(--mute); }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; padding:16px 24px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mute); }
  select, input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
                  background:var(--card); color:var(--ink); }
  input[type=number] { width:96px; }
  button { font:inherit; padding:9px 18px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; padding:0 24px 8px; }
  .chip { padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:var(--card);
          color:var(--ink); font-size:12px; cursor:pointer; font-weight:400; }
  .chip:hover { border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:8px 24px 24px; }
  @media (max-width: 800px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card h2 { margin:0 0 8px; font-size:13px; color:var(--mute); font-weight:600; }
  .frame { display:flex; justify-content:center; background:repeating-conic-gradient(#8881 0 25%, #0000 0 50%) 0 0/16px 16px;
           border-radius:8px; min-height:120px; align-items:center; }
  img { max-width:100%; max-height:70vh; display:block; }
  #status { padding:0 24px; color:var(--mute); min-height:22px; }
  #status.err { color:#d33; }
  details { padding:0 24px 32px; }
  pre { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px;
        overflow:auto; max-height:360px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Chameleon Viewer</h1>
  <p>Pick a design and a target canvas; the engine rearranges it and the real renderer draws both.</p>
</header>

<div class="bar">
  <label>Design <select id="design"></select></label>
  <label>Width <input id="w" type="number" min="16" max="8000" value="1080"></label>
  <label>Height <input id="h" type="number" min="16" max="8000" value="1920"></label>
  <button id="go">Resize</button>
</div>
<div class="presets" id="presets"></div>
<div id="status"></div>

<div class="grid">
  <div class="card"><h2 id="srcTitle">Original</h2><div class="frame"><img id="src" alt="original design"></div></div>
  <div class="card"><h2 id="outTitle">Resized</h2><div class="frame"><img id="out" alt="resized design"></div></div>
</div>

<details><summary>Engine output JSON</summary><pre id="json"></pre></details>

<script>
const PRESETS = [["Instagram Post",1080,1080],["Instagram Story",1080,1920],["Facebook Post",1200,630],
  ["YouTube Thumbnail",1280,720],["Twitter Header",1500,500],["LinkedIn Banner",1584,396],
  ["Leaderboard",728,90],["Medium Rectangle",300,250],["Half Page",300,600],["Skyscraper",160,600],
  ["Billboard",970,250],["A4 Poster",2480,3508]];
const $ = id => document.getElementById(id);

async function init() {
  const names = await (await fetch("/api/designs")).json();
  $("design").innerHTML = names.map(n => `<option>${n}</option>`).join("");
  $("presets").innerHTML = PRESETS.map(([n,w,h]) =>
    `<button class="chip" data-w="${w}" data-h="${h}">${n} ${w}×${h}</button>`).join("");
  $("presets").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    $("w").value = b.dataset.w; $("h").value = b.dataset.h; run();
  };
  $("go").onclick = run;
  run();
}

async function run() {
  const go = $("go"); go.disabled = true;
  $("status").className = ""; $("status").textContent = "Resizing…";
  try {
    const r = await fetch("/api/resize", { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ design: $("design").value, width: +$("w").value, height: +$("h").value }) });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $("src").src = "data:image/png;base64," + d.source_png;
    $("out").src = "data:image/png;base64," + d.output_png;
    $("srcTitle").textContent = `Original ${d.source_size[0]}×${d.source_size[1]}`;
    $("outTitle").textContent = `Resized ${d.output.canvas.width}×${d.output.canvas.height}`;
    $("json").textContent = JSON.stringify(d.output, null, 2);
    $("status").textContent = `${d.elements} elements rearranged in ${d.seconds}s`;
  } catch (e) {
    $("status").className = "err"; $("status").textContent = "Error: " + e.message;
  } finally { go.disabled = false; }
}
init();
</script>
</body>
</html>
